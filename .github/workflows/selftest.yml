name: selftest
on: [push, pull_request]
jobs:
  selftest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: brew install ffmpeg
      - run: cd engine && npm ci --silent
      - run: bash scripts/selftest.sh
