<!doctype html><html><head><meta charset="utf-8"><style id="fontfaces"></style><style>

html,body{margin:0;background:#000;overflow:hidden}

.inner{position:absolute;inset:0;background:var(--bg);color:var(--fg);overflow:hidden}

.kick{display:inline-flex;align-items:center;gap:14px;font-size:28px;color:var(--fg);opacity:.9;align-self:var(--kal,flex-start)}
.dot{width:14px;height:14px;border-radius:50%;background:var(--hl);flex:0 0 auto}
.kick .ln{width:52px;height:5px;border-radius:3px;background:var(--hl);flex:0 0 auto}
.kick .nm{color:var(--hl)}
#stage[data-kick=tag] .kick{background:var(--hl);color:var(--hlfg);padding:.45em .8em;border-radius:calc(var(--r)*.35);opacity:1}
#stage[data-kick=plain] .kick{opacity:.62}

#stage[data-kf=body] .kick{font-family:Body;font-weight:800;letter-spacing:.06em;font-size:30px}
/* estilo del resaltado H() según el look */
#stage[data-hl=underline] .hlb{background:linear-gradient(var(--hl),var(--hl)) 0 94%/100% .13em no-repeat;color:inherit;padding:0 .02em}
#stage[data-hl=marker] .hlb{background:linear-gradient(transparent 50%,color-mix(in srgb,var(--hl) 85%,transparent) 50%,color-mix(in srgb,var(--hl) 85%,transparent) 90%,transparent 90%);color:inherit;padding:0 .06em}

#stage[data-panel=outline] .pnl{background:transparent;box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--fg) 30%,transparent)}

#stage[data-panel=flat] .pnl{background:transparent;border-radius:0!important;box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--fg) 25%,transparent)}
/* contorno: el relleno del color de fondo tapa las superposiciones internas de las fuentes variables */

#logo{position:absolute;z-index:60;object-fit:contain}
#prog{position:absolute;left:0;top:0;z-index:61;background:var(--accent)}

// punch: rápido, fuerte, overshoot chico · elastic: resortes visibles. cap = cuánto puede sobrepasar rise() (en %) sin cortar el texto en su máscara

// sacudida breve que se apaga: devuelve [dx,dy] en px → el.style.translate=`${dx}px ${dy}px`

   mbDefs=document.createElementNS('http://www.w3.org/2000/svg','defs');s.appendChild(mbDefs);document.body.appendChild(s);}

const hOf=el=>el._h||(el._h=el.offsetHeight);

 if(BLUR)mb(el,0,(x-M.pop(P(t-DT(),a,D_)))*(40+.2*hOf(el)));}

// ───────── layout ─────────

// morph: forma de origen = último [data-morph] o resaltado (.hlb/.hlc) de la escena anterior en su estado final; si no hay, el centro
function morphSrc(pv,veil){let r=null;if(pv){pv.root.style.display='block';camSet(pv,pv.D);const q=pv.inner.querySelectorAll('[data-morph]');
  const el=q.length?q[q.length-1]:[...pv.inner.querySelectorAll('.hlb,.hlc')].pop();if(el){const b=el.getBoundingClientRect();if(b.width>4&&b.height>4)r={x:b.left,y:b.top,w:b.width,h:b.height};}
  pv.root.style.display='none';if(veil)veil.style.background=pv.th.hl;}

// look.punch: momento clave de la escena (p.at, countEnd del stat, botón del cta o la primera palabra clave) para el pulso de cámara
function keyT(sc){const p=sc.p,num=v=>typeof v==='number'?v:Array.isArray(v)&&typeof v[0]==='number'?v[0]:null;

// cámara 3D: look.cam tilt|orbit y/o look.depth (la escena se asienta desde una leve inclinación al entrar)
function cam3d(sc,t,cq,cm){let rx=0,ry=0;if(cm==='tilt'){rx=L(7,-2,cq);ry=L(-4,3,cq);}else if(cm==='orbit'){ry=L(-11,11,cq);rx=3+2*Math.sin(cq*Math.PI);}

 if(k!==curCap){curCap=k;capEl.innerHTML='';if(k>=0)CAPS[k].words.forEach((w,i)=>{if(i)capEl.appendChild(document.createTextNode(' '));h('span','',capEl,w.w);});}

   else if(cs_==='underline'){sp.style.color=w.k?'var(--hl)':'var(--fg)';sp.style.boxShadow=on?'inset 0 -.14em 0 var(--hl)':'none';}
