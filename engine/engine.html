<!doctype html><html><head><meta charset="utf-8"><style id="fontfaces"></style><style>

.inner{position:absolute;inset:0;background:var(--bg);color:var(--fg);overflow:hidden}

 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.grid{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(var(--fg) 1px,transparent 1px),linear-gradient(90deg,var(--fg) 1px,transparent 1px);background-size:90px 90px}
.kick{display:inline-flex;align-items:center;gap:14px;font-size:28px;color:var(--fg);opacity:.9}

// ───────── utilidades ─────────
const S=document.getElementById('stage');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), P=(t,a,d)=>cl((t-a)/(d||1e-6)), L=(a,b,x)=>a+(b-a)*x;
const E={o3:x=>1-Math.pow(1-x,3),expo:x=>x>=1?1:1-Math.pow(2,-10*x),
 back:x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},
 io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 el:x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*2*Math.PI/3)+1};

function ml(parent,html,css,cls){const m=h('div',css||'',parent,null,'m '+(cls||''));return h('div','',m,html)}
function rise(el,t,a,d=.55){const x=E.expo(P(t,a,d));el.style.transform=`translateY(${(1-x)*140}%)`;}
function popIn(el,t,a,d=.45){const x=E.back(P(t,a,d));el.style.opacity=P(t,a,.1);el.style.transform=`translateY(${(1-x)*40}px) scale(${L(.8,1,x)})`;}
function fadeUp(el,t,a,d=.4){const x=E.o3(P(t,a,d));el.style.opacity=x;el.style.transform=`translateY(${(1-x)*24}px)`;}
function kick(parent,txt){return h('div','',parent,`<span class="dot"></span>${txt}`,'kick mono')}
function split(el){const txt=el.textContent;el.innerHTML='';return [...txt].map(c=>h('span','',el,c===' '?'&nbsp;':c,'ch'))}
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%]/g,'');

 check:'<path d="M5 12l5 5L20 7"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',

 play:'<path d="M7 4l13 8-13 8z"/>', shield:'<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/>',

 gift:'<rect x="3" y="8" width="18" height="4"/><path d="M5 12v9h14v-9M12 8v13M12 8S10 3 7.5 4 9 8 12 8zm0 0s2-5 4.5-4S15 8 12 8z"/>',
 pin:'<path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>', camera:'<path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/>',
 med:'<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>', eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',

const icon=(n,sw=2.4)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${I[n]||I.star}</svg>`;

// ───────── marca y temas ─────────
let CFG,BR,W,H,U,AREA,FRAME=0,SCN=[],CAPS=[],capEl,logoEl,progEl,TOTAL;
function hex2rgb(x){x=x.replace('#','');if(x.length===3)x=[...x].map(c=>c+c).join('');const n=parseInt(x,16);return[(n>>16)&255,(n>>8)&255,n&255]}

 const hl=cand.find(x=>con(bg,x)>=2.2)||fg, hl2=cand.find(x=>x!==hl&&con(bg,x)>=2.2)||fg;
 const hlfg=con(hl,c.dark)>=con(hl,c.light)?c.dark:c.light;
 return {bg,fg,hl,hl2,hlfg,hl2fg:con(hl2,c.dark)>=con(hl2,c.light)?c.dark:c.light,dark:lum(bg)<.25};}
function applyTheme(el,th){el.style.setProperty('--bg',th.bg);el.style.setProperty('--fg',th.fg);el.style.setProperty('--hl',th.hl);el.style.setProperty('--hl2',th.hl2);

function applyBrand(){const f=BR.fonts,css=[],R=document.documentElement.style;
 const alias={display:'Display',body:'Body',mono:'Mono',accent:'Accent'};
 for(const k in alias){const ff=f[k]||f.body;for(const x of ff.files||[])css.push(`@font-face{font-family:${alias[k]};src:url("${x.url}");font-weight:${x.weight||400};font-style:${x.style||'normal'};font-stretch:50% 200%}`);}
 document.getElementById('fontfaces').textContent=css.join('\n');
 const d=f.display||{};R.setProperty('--dw',d.weight||800);R.setProperty('--ds',d.stretch||'100%');R.setProperty('--dt',d.tracking||'-0.02em');
 R.setProperty('--dl',d.leading||.92);R.setProperty('--du',d.upper===false?'none':'uppercase');R.setProperty('--bw',(f.body||{}).weight||700);
 R.setProperty('--ai',(f.accent||{}).italic?'italic':'normal');R.setProperty('--r',((BR.style||{}).radius??36)+'px');
 for(const k of['dark','light','accent','accent2','mute'])if(BR.colors[k])R.setProperty('--'+k,BR.colors[k]);}

// ───────── layout ─────────
function layout(capOn){const port=H/W>1.3,x=Math.round(W*.08),top=Math.round(H*(port?.13:.11));

const UPS={compare:1.3,icons:1.3,list:1.2,steps:1.3,phone:1.3,cta:1.3,stat:1.15,donut:1.2,bars:1.2};
// Escala el contenido hasta que entre en el área (sin desbordes horizontales)
function fit(sc){const a=sc.area,fb=sc.fitbox,box=sc.box,max=sc.p.maxScale||(a.port?UPS[sc.type]:0)||1;let s=max,ok=false;

  return box.scrollWidth>box.clientWidth+2;};
 for(let k=0;k<40;k++){fb.style.width=(a.w/s)+'px';if(!over()){ok=true;break;}s*=.95;if(s<.3)break;}
 fb.style.transform=`scale(${s})`;const hh=box.scrollHeight*s,va=sc.p.valign||'center';
 fb.style.top=(a.y+(va==='top'?0:va==='bottom'?a.h-hh:(a.h-hh)/2))+'px';sc.scale=s;if(!ok)console.warn('no entra',sc.i,sc.type);}

// ───────── transiciones ─────────
const TRD={wipe:.5,slide:.55,circle:.6,zoom:.55,push:.55,cut:0};
function trIn(sc,t){const a=sc.tr,n=sc.inner;
 if(a==='wipe'){const x=E.expo(P(t,0,.42)),y=E.expo(P(t,.08,.45));sc.veil.style.clipPath=`inset(${(1-x)*100}% 0 0 0)`;n.style.clipPath=`inset(${(1-y)*100}% 0 0 0)`;sc.cam.style.translate=`0 ${(1-y)*120}px`;}
 else if(a==='slide'){const x=E.expo(P(t,0,.55));n.style.transform=`translateX(${(1-x)*100}%)`;}
 else if(a==='push'){const x=E.expo(P(t,0,.55));n.style.transform=`translateY(${(1-x)*100}%)`;}
 else if(a==='circle'){const x=E.io(P(t,0,.6));n.style.clipPath=x>=1?'none':`circle(${x*150}% at ${sc.p.cx||50}% ${sc.p.cy||50}%)`;}
 else if(a==='zoom'){const x=E.expo(P(t,0,.55));n.style.opacity=P(t,0,.25);n.style.transform=`scale(${L(1.25,1,x)})`;}}
function trOut(sc,nx,t){const x=E.expo(P(t,0,TRD[nx.tr]||.5));   // t = tiempo local de la escena entrante
 if(nx.tr==='slide')sc.inner.style.transform=`translateX(${-x*35}%)`;else if(nx.tr==='push')sc.inner.style.transform=`translateY(${-x*45}%)`;
 else sc.inner.style.transform=`scale(${L(1,.94,x)})`;}

// ───────── escenas ─────────
// Cada escena: SC.tipo=(p,c)=>(t=>{...}) · c={box,inner,root,D,words,th,area,port}. Ver reference/escenas.md
const SC={};
// sincroniza palabras mostradas con las dichas (tiempos locales); devuelve [{el,t}]
function syncWords(tokens,words,start=0){let k=0;let last=start;return tokens.map(tok=>{const n=norm(tok);let tt=null;
 for(let j=k;j<words.length;j++){if(n&&norm(words[j].w)===n){tt=words[j].s;k=j+1;break;}}
 if(tt==null){for(let j=k;j<Math.min(words.length,k+4);j++){if(n&&norm(words[j].w).startsWith(n.slice(0,4))){tt=words[j].s;k=j+1;break;}}}
 if(tt==null)tt=last+.12;last=tt;return tt;});}
SC.title=(p,c)=>{const b=c.box;b.style.textAlign=p.align||'left';
 const k=p.kick?kick(b,p.kick):null;

 return t=>{if(k)fadeUp(k,t,.15);ls.forEach((l,i)=>rise(l,t,at[i]??(.2+i*.1),.6));if(sub)rise(sub,t,p.subAt??(.4+ls.length*.1));};};
SC.kinetic=(p,c)=>{const b=c.box,txt=p.text||c.words.map(w=>w.w).join(' ');const hl=new Set((p.hl||[]).map(norm)),hc=new Set((p.hc||[]).map(norm));
 const k=p.kick?kick(b,p.kick):null;if(k)k.style.marginBottom='30px';

 const toks=txt.split(/\s+/).filter(Boolean);const tt=syncWords(toks,c.words,.15);
 const ws=toks.map((w,i)=>{const m=h('span','display:inline-block;overflow:hidden;vertical-align:top;padding:.1em 0 .06em;margin:-.1em .2em -.06em 0',wrap);
  const n=norm(w);return h('span','display:inline-block',m,w,hl.has(n)?'hlb':hc.has(n)?'hlc':'');});
 return t=>{if(k)fadeUp(k,t,.05);ws.forEach((w,i)=>{const x=E.expo(P(t,tt[i]-.08,.4));w.style.transform=`translateY(${(1-x)*110}%)`;});};};
SC.bigword=(p,c)=>{const b=c.box;b.style.textAlign=p.align||'left';const k=p.kick?kick(b,p.kick):null;
 const lines=(p.lines||[p.word]).map((s,i)=>{const m=h('div',`font-size:${p.size||260}px;color:var(--hl);overflow:hidden;padding:.14em 0 .04em;margin:${i?-.14:0}em 0 -.04em`,b,null,'disp nw');
  if(k&&!i)m.style.marginTop='20px';return split(h('div','',m,s))});
 const sub=p.sub?ml(b,p.sub,`font-size:${p.subSize||84}px;margin-top:40px`,'acc'):null;
 return t=>{if(k)fadeUp(k,t,.15);let n=0;lines.forEach(cs=>cs.forEach(ch=>{const x=E.expo(P(t,(p.at??.2)+n*.035,.6));ch.style.transform=`translateY(${(1-x)*110}%)`;n++;}));
  if(sub)rise(sub,t,p.subAt??.9);};};
SC.stat=(p,c)=>{const b=c.box;b.style.textAlign=p.align||'left';const k=p.kick?kick(b,p.kick):null;
 const row=h('div',`font-size:${p.size||300}px;color:var(--hl);margin-top:20px;font-variant-numeric:tabular-nums;line-height:.95`,b,null,'disp nw');

 const bar=h('div','height:14px;background:var(--hl);border-radius:8px;margin:18px 0 26px;transform-origin:left;width:'+(p.align==='center'?'40%;margin-left:30%':'45%'),b);
 const lab=p.label?ml(b,p.label,`font-size:${p.labelSize||96}px`,'disp'):null;
 const sub=p.sub?h('div','font-size:28px;margin-top:26px',b,p.sub,'mono sub'):null;const a=p.at??.25,ce=p.countEnd??a+1.2;

  num.textContent=(p.prefix||'')+fmtNum(v,p.decimals||0)+(p.suffix||'');bar.style.transform=`scaleX(${E.expo(P(t,ce-.1,.5))})`;

function markIco(parent,m,i){const ic=h('div','',parent,null,'ico');

 else if(m==='x'){ic.style.cssText+='border:5px solid var(--sub);color:var(--sub)';ic.innerHTML=icon('x',3.2);}
 else if(m==='num'||!m){ic.style.cssText+='background:var(--fg);color:var(--bg)';ic.textContent=String(i+1).padStart(2,'0');}

 return ic;}
SC.list=(p,c)=>{const b=c.box;const k=p.kick?kick(b,p.kick):null;

  const ic=markIco(r,it.mark||p.mark,i);const tx=h('div',`flex:1;font-size:${p.isize||56}px`,r,it.t,'body');
  const st=it.strikeAt!=null?h('div','position:absolute;left:114px;right:0;top:52%;height:7px;background:var(--hl);border-radius:4px;transform-origin:left',r):null;
  return {r,ic,tx,st,it};});

  its.forEach(o=>{const a=o.it.at??(.4+its.indexOf(o)*.3);popIn(o.r,t,a);const ip=E.el(P(t,a+.05,.7));o.ic.style.transform=`scale(${ip}) rotate(${(1-ip)*-30}deg)`;
   if(o.st){o.st.style.transform=`scaleX(${E.o3(P(t,o.it.strikeAt,.35))})`;o.tx.style.opacity=L(1,.45,P(t,o.it.strikeAt,.3));}});};};
SC.steps=(p,c)=>{const b=c.box;const k=p.kick?kick(b,p.kick):null;

 const list=h('div','position:relative;margin-top:50px;display:flex;flex-direction:column;gap:46px',b);
